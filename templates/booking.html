```html
<script>
    const form = document.getElementById("booking-form");
    const typeSelect = document.getElementById("consultation-type");
    const addressField = document.getElementById("address-field");
    const addressInput = document.getElementById("home-address");
    const emergencyInput = document.getElementById("is-emergency");
    const priceLabel = document.getElementById("consultation-price");
    const consultationName = document.getElementById("consultation-name");
    const message = document.getElementById("booking-message");
    const submitButton = document.getElementById("submit-button");
    const availabilityButton = document.getElementById("check-availability");

    const prices = {{ consultation_prices | tojson }};

    const names = {{ {
        "video": "Video Visit",
        "phone": "Phone Call",
        "in_person": "In Person",
        "home": "Home Visit"
    } | tojson }};

    let isSubmitting = false;
    let isCheckingAvailability = false;

    // Safely read a server response, including non-JSON error responses.
    async function readResponse(response) {
        const text = await response.text();

        if (!text) {
            return {};
        }

        try {
            return JSON.parse(text);
        } catch {
            throw new Error(
                "The server returned an invalid response. Please check the Flask terminal."
            );
        }
    }

    function showMessage(text, type = "info") {
        message.textContent = text;

        message.style.color =
            type === "error" ? "#b42318" :
            type === "success" ? "#087f8c" :
            "#20323a";
    }

    function updateConsultation() {
        const type = typeSelect.value;
        const isHomeVisit = type === "home";

        addressField.hidden = !isHomeVisit;
        addressInput.required = isHomeVisit;

        if (!isHomeVisit) {
            addressInput.value = "";
        }

        if (Object.prototype.hasOwnProperty.call(prices, type)) {
            priceLabel.textContent =
                "Consultation fee: ₹" + prices[type];

            consultationName.textContent = names[type];
        } else {
            priceLabel.textContent = "Price unavailable";
            consultationName.textContent = "Select a consultation";
        }
    }

    function getBookingData() {
        return {
            patient_name: document
                .getElementById("patient-name").value.trim(),

            doctor_id: document
                .getElementById("doctor-id").value,

            appointment_date: document
                .getElementById("appointment-date").value,

            start_time: document
                .getElementById("start-time").value,

            duration_minutes: Number(
                document.getElementById("duration").value
            ),

            reason: document
                .getElementById("reason").value.trim(),

            consultation_type: typeSelect.value,

            address: typeSelect.value === "home"
                ? addressInput.value.trim()
                : "",

            is_emergency: emergencyInput.checked
        };
    }

    function formatAlternative(slot) {
        if (typeof slot === "string") {
            return slot;
        }

        if (slot.display) {
            return slot.display;
        }

        const date = slot.appointment_date || "";
        const start = slot.start_time || "";
        const end = slot.end_time || "";

        if (date && start && end) {
            return `${date}, ${start}–${end}`;
        }

        if (date && start) {
            return `${date}, ${start}`;
        }

        if (start && end) {
            return `${start}–${end}`;
        }

        return start || date || "Alternative slot";
    }

    function validateAvailabilityFields(data) {
        if (!data.doctor_id) {
            showMessage("Please select a doctor.", "error");
            document.getElementById("doctor-id").focus();
            return false;
        }

        if (!data.appointment_date) {
            showMessage("Please select an appointment date.", "error");
            document.getElementById("appointment-date").focus();
            return false;
        }

        if (!data.start_time) {
            showMessage("Please select a start time.", "error");
            document.getElementById("start-time").focus();
            return false;
        }

        if (!Number.isFinite(data.duration_minutes) ||
            data.duration_minutes <= 0) {
            showMessage("Please select a valid duration.", "error");
            document.getElementById("duration").focus();
            return false;
        }

        const selectedDate = document.getElementById("appointment-date");

        if (!selectedDate.checkValidity()) {
            showMessage("Please select a valid date.", "error");
            selectedDate.focus();
            return false;
        }

        return true;
    }

    typeSelect.addEventListener("change", updateConsultation);
    updateConsultation();

    // CHECK AVAILABILITY
    availabilityButton.addEventListener("click", async () => {
        if (isCheckingAvailability || isSubmitting) {
            return;
        }

        const data = getBookingData();

        if (!validateAvailabilityFields(data)) {
            return;
        }

        isCheckingAvailability = true;
        availabilityButton.disabled = true;

        showMessage("Checking doctor availability...");

        try {
            const params = new URLSearchParams({
                doctor_id: data.doctor_id,
                date: data.appointment_date,
                time: data.start_time,
                duration: String(data.duration_minutes)
            });

            const response = await fetch(
                "/api/check-availability?" + params.toString(),
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            const result = await readResponse(response);

            if (!response.ok || result.success === false) {
                showMessage(
                    result.message ||
                    result.error ||
                    `Availability check failed (HTTP ${response.status}).`,
                    "error"
                );
                return;
            }

            if (typeof result.available !== "boolean") {
                showMessage(
                    result.message ||
                    "The server did not return an availability status. Please check the Flask API response.",
                    "error"
                );
                return;
            }

            if (result.available) {
                showMessage(
                    result.message || "This appointment slot is available.",
                    "success"
                );
            } else {
                let text = result.message ||
                    "This appointment slot is not available.";

                if (Array.isArray(result.alternatives) &&
                    result.alternatives.length > 0) {
                    text += "\nSuggested alternatives: " +
                        result.alternatives.map(formatAlternative).join(", ");
                }

                showMessage(text, "error");
            }
        } catch (error) {
            showMessage(
                error.message ||
                "Could not check availability. Please try again.",
                "error"
            );
        } finally {
            isCheckingAvailability = false;
            availabilityButton.disabled = false;
        }
    });

    // CONFIRM APPOINTMENT
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (isSubmitting || isCheckingAvailability) {
            return;
        }

        if (!form.reportValidity()) {
            return;
        }

        const data = getBookingData();

        if (!data.patient_name || data.patient_name.length < 2) {
            showMessage("Please enter the patient's full name.", "error");
            document.getElementById("patient-name").focus();
            return;
        }

        if (data.consultation_type === "home" && !data.address) {
            showMessage("Please enter the home visit address.", "error");
            addressInput.focus();
            return;
        }

        isSubmitting = true;
        submitButton.disabled = true;
        availabilityButton.disabled = true;

        showMessage("Submitting your appointment...");

        try {
            const response = await fetch("/api/appointments", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await readResponse(response);

            if (!response.ok || result.success !== true) {
                showMessage(
                    result.message ||
                    result.error ||
                    `Booking failed (HTTP ${response.status}). Please check your details.`,
                    "error"
                );
                return;
            }

            showMessage(
                result.message ||
                "Appointment booked successfully. Opening dashboard...",
                "success"
            );

            // Redirect only after the API confirms a successful booking.
            window.location.assign("/dashboard");

        } catch (error) {
            showMessage(
                error.message ||
                "Could not submit the appointment. Please try again.",
                "error"
            );
        } finally {
            isSubmitting = false;
            submitButton.disabled = false;
            availabilityButton.disabled = false;
        }
    });
</script>
