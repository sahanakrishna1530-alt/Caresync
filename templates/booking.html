
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Consultation | CareSync</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 16px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #20323a;
        }

        .booking-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 30px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(30, 50, 70, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #174a55;
        }

        .subtitle {
            margin-bottom: 26px;
            color: #667780;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full-width { grid-column: 1 / -1; }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd7dc;
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #b8dce1;
            border-color: #287987;
        }

        textarea { resize: vertical; }

        .consultation-summary {
            margin: 22px 0;
            padding: 16px;
            background: #eef7f7;
            border-radius: 10px;
        }

        .consultation-summary p { margin: 5px 0; }

        .emergency-option {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .emergency-option input { width: auto; }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            padding: 13px 18px;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #check-availability {
            background: #e5f2f4;
            color: #174a55;
        }

        #submit-button {
            background: #176b75;
            color: white;
        }

        #booking-message {
            min-height: 24px;
            margin-top: 18px;
            line-height: 1.5;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #176b75;
            text-decoration: none;
        }

        @media (max-width: 560px) {
            .booking-container { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: auto; }
            .button-row { flex-direction: column; }
            .button-row button { width: 100%; }
        }
    </style>
</head>

<body>
    <main class="booking-container">
        <h1>Book a Consultation</h1>

        <p class="subtitle">
            Select a doctor, choose a suitable time, and confirm your appointment.
        </p>

        <form id="booking-form">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="patient-name">Patient name</label>
                    <input
                        type="text"
                        id="patient-name"
                        name="patient_name"
                        minlength="2"
                        required
                    >
                </div>

                <div class="form-group full-width">
                    <label for="consultation-type">Consultation type</label>
                    <select id="consultation-type" name="consultation_type" required>
                        <option value="video">Video Visit</option>
                        <option value="phone">Phone Call</option>
                        <option value="in_person">In Person</option>
                        <option value="home">Home Visit</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="doctor-id">Doctor</label>
                    <select id="doctor-id" name="doctor_id" required>
                        <option value="">Select a doctor</option>
                        {% for doctor in doctors %}
                        <option value="{{ doctor.id }}">
                            {{ doctor.name }}{% if doctor.specialization %} — {{ doctor.specialization }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="appointment-date">Appointment date</label>
                    <input
                        type="date"
                        id="appointment-date"
                        name="appointment_date"
                        min="{{ today }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="start-time">Start time</label>
                    <input type="time" id="start-time" name="start_time" required>
                </div>

                <div class="form-group">
                    <label for="duration">Duration</label>
                    <select id="duration" name="duration" required>
                        <option value="15">15 minutes</option>
                        <option value="30" selected>30 minutes</option>
                        <option value="45">45 minutes</option>
                        <option value="60">60 minutes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reason">Reason for consultation</label>
                    <input
                        type="text"
                        id="reason"
                        name="reason"
                        placeholder="Briefly describe the reason"
                    >
                </div>

                <div class="form-group full-width" id="address-field" hidden>
                    <label for="home-address">Home visit address</label>
                    <textarea id="home-address" name="address" rows="3"></textarea>
                </div>

                <div class="form-group full-width emergency-option">
                    <input type="checkbox" id="is-emergency" name="is_emergency">
                    <label for="is-emergency">Mark as an emergency request</label>
                </div>
            </div>

            <div class="consultation-summary">
                <p id="consultation-name">Video Visit</p>
                <p id="consultation-price">Consultation fee</p>
            </div>

            <div class="button-row">
                <button type="button" id="check-availability">
                    Check Availability
                </button>

                <button type="submit" id="submit-button">
                    Confirm Appointment
                </button>
            </div>

            <p id="booking-message" role="status" aria-live="polite"></p>
        </form>

        <a class="back-link" href="/dashboard">Back to Dashboard</a>
    </main>

    <script>
    (() => {
        "use strict";

        const form = document.getElementById("booking-form");
        const typeSelect = document.getElementById("consultation-type");
        const doctorSelect = document.getElementById("doctor-id");
        const dateInput = document.getElementById("appointment-date");
        const timeInput = document.getElementById("start-time");
        const durationInput = document.getElementById("duration");
        const patientInput = document.getElementById("patient-name");
        const reasonInput = document.getElementById("reason");
        const addressField = document.getElementById("address-field");
        const addressInput = document.getElementById("home-address");
        const emergencyInput = document.getElementById("is-emergency");
        const priceLabel = document.getElementById("consultation-price");
        const consultationName = document.getElementById("consultation-name");
        const message = document.getElementById("booking-message");
        const submitButton = document.getElementById("submit-button");
        const availabilityButton = document.getElementById("check-availability");

        // Jinja renders this as a JavaScript object.
        const prices = {{ consultation_prices | tojson }};

        const names = {
            video: "Video Visit",
            phone: "Phone Call",
            in_person: "In Person",
            home: "Home Visit"
        };

        let isSubmitting = false;
        let isCheckingAvailability = false;
        let checkedBookingKey = null;

        function showMessage(text, type = "info") {
            message.textContent = text;
            message.style.color =
                type === "error" ? "#b42318" :
                type === "success" ? "#087f8c" :
                "#20323a";
        }

        function getBookingData() {
            const type = typeSelect.value;

            return {
                patient_name: patientInput.value.trim(),
                doctor_id: doctorSelect.value,
                appointment_date: dateInput.value,
                start_time: timeInput.value,
                duration_minutes: Number(durationInput.value),
                reason: reasonInput.value.trim(),
                consultation_type: type,
                address: type === "home" ? addressInput.value.trim() : "",
                is_emergency: emergencyInput.checked
            };
        }

        function bookingKey(data) {
            return JSON.stringify(data);
        }

        function invalidateAvailability() {
            checkedBookingKey = null;
        }

        function updateConsultation() {
            const type = typeSelect.value;
            const isHomeVisit = type === "home";

            addressField.hidden = !isHomeVisit;
            addressInput.required = isHomeVisit;

            if (!isHomeVisit) {
                addressInput.value = "";
            }

            if (Object.prototype.hasOwnProperty.call(prices, type)) {
                priceLabel.textContent = "Consultation fee: ₹" + prices[type];
                consultationName.textContent = names[type] || type;
            } else {
                priceLabel.textContent = "Price unavailable";
                consultationName.textContent = "Select a consultation";
            }

            invalidateAvailability();
        }

        async function readResponse(response) {
            const text = await response.text();

            if (!text) {
                throw new Error("The server returned an empty response.");
            }

            try {
                return JSON.parse(text);
            } catch (error) {
                console.error("Unexpected server response:", text);
                throw new Error(
                    "The server returned a non-JSON response. Please check the API route."
                );
            }
        }

        function validateBooking(data) {
            if (!form.reportValidity()) {
                return false;
            }

            if (data.patient_name.length < 2) {
                showMessage("Please enter the patient's name.", "error");
                patientInput.focus();
                return false;
            }

            if (!data.doctor_id) {
                showMessage("Please select a doctor.", "error");
                doctorSelect.focus();
                return false;
            }

            if (!data.reason) {
                showMessage("Please enter the reason for consultation.", "error");
                reasonInput.focus();
                return false;
            }

            if (!Number.isInteger(data.duration_minutes) ||
                data.duration_minutes <= 0) {
                showMessage("Please select a valid appointment duration.", "error");
                durationInput.focus();
                return false;
            }

            if (data.consultation_type === "home" && !data.address) {
                showMessage("Please enter the home visit address.", "error");
                addressInput.focus();
                return false;
            }

            return true;
        }

        function formatAlternative(slot) {
            if (typeof slot === "string") {
                return slot;
            }

            if (!slot || typeof slot !== "object") {
                return "Alternative slot";
            }

            if (slot.display) {
                return slot.display;
            }

            const date = slot.appointment_date || slot.date || "";
            const start = slot.start_time || slot.time || "";
            const end = slot.end_time || "";

            if (date && start && end) return `${date}, ${start}–${end}`;
            if (date && start) return `${date}, ${start}`;
            if (start && end) return `${start}–${end}`;

            return start || date || "Alternative slot";
        }

        async function checkAvailability() {
            if (isCheckingAvailability || isSubmitting) {
                return;
            }

            const data = getBookingData();

            if (!validateBooking(data)) {
                return;
            }

            isCheckingAvailability = true;
            availabilityButton.disabled = true;
            showMessage("Checking doctor availability...");

            try {
                const params = new URLSearchParams({
                    doctor_id: data.doctor_id,
                    date: data.appointment_date,
                    time: data.start_time,
                    duration: String(data.duration_minutes)
                });

                const response = await fetch(
                    "/api/check-availability?" + params.toString(),
                    {
                        method: "GET",
                        headers: { "Accept": "application/json" }
                    }
                );

                const result = await readResponse(response);

                if (!response.ok || result.success !== true) {
                    invalidateAvailability();
                    showMessage(
                        result.message || result.error ||
                        `Availability check failed (HTTP ${response.status}).`,
                        "error"
                    );
                    return;
                }

                if (result.available === true) {
                    // Only mark this exact form data as checked.
                    checkedBookingKey = bookingKey(getBookingData());

                    showMessage(
                        result.message ||
                        "This appointment slot is available. You can confirm the booking.",
                        "success"
                    );
                } else if (result.available === false) {
                    invalidateAvailability();

                    let text = result.message ||
                        "This appointment slot is not available.";

                    if (Array.isArray(result.alternatives) &&
                        result.alternatives.length > 0) {
                        text += "\nSuggested alternatives: " +
                            result.alternatives.map(formatAlternative).join("; ");
                    }

                    showMessage(text, "error");
                } else {
                    invalidateAvailability();
                    showMessage(
                        "The server response did not contain a valid availability status.",
                        "error"
                    );
                }
            } catch (error) {
                invalidateAvailability();
                console.error("Availability check error:", error);
                showMessage(error.message || "Could not check availability.", "error");
            } finally {
                isCheckingAvailability = false;
                availabilityButton.disabled = false;
            }
        }

        availabilityButton.addEventListener("click", checkAvailability);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (isSubmitting || isCheckingAvailability) {
                return;
            }

            const data = getBookingData();

            if (!validateBooking(data)) {
                return;
            }

            // Require an availability check for the current form values.
            if (checkedBookingKey !== bookingKey(data)) {
                showMessage(
                    "Please click Check Availability and confirm the slot is available before booking.",
                    "error"
                );
                return;
            }

            isSubmitting = true;
            submitButton.disabled = true;
            availabilityButton.disabled = true;
            showMessage("Submitting your appointment...");

            try {
                const response = await fetch("/api/appointments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await readResponse(response);

                if (!response.ok || result.success !== true) {
                    invalidateAvailability();
                    showMessage(
                        result.message || result.error ||
                        `Booking failed (HTTP ${response.status}).`,
                        "error"
                    );
                    return;
                }

                showMessage(
                    result.message ||
                    "Appointment booked successfully. Opening dashboard...",
                    "success"
                );

                window.location.assign("/dashboard");
            } catch (error) {
                invalidateAvailability();
                console.error("Appointment booking error:", error);
                showMessage(error.message || "Could not submit the appointment.", "error");
            } finally {
                isSubmitting = false;
                submitButton.disabled = false;
                availabilityButton.disabled = false;
            }
        });

        // Any change to booking details requires a fresh availability check.
        [
            patientInput,
            doctorSelect,
            dateInput,
            timeInput,
            durationInput,
            reasonInput,
            addressInput,
            emergencyInput
        ].forEach((element) => {
            element.addEventListener("input", invalidateAvailability);
            element.addEventListener("change", invalidateAvailability);
        });

        typeSelect.addEventListener("change", updateConsultation);

        updateConsultation();
    })();
    </script>
</body>
</html>
